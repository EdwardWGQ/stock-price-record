project_id = "stock-atlas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[functions.market-data]
# The handler independently verifies the end-user access token with Auth getUser.
# Needed for current publishable-key compatibility, never a public data endpoint.
verify_jwt = false
