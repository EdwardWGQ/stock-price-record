project_id = "stock-atlas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "https://stock-atlas.pages.dev"
additional_redirect_urls = ["https://stock-atlas.pages.dev/", "https://stock-atlas.pages.dev/auth/callback", "http://127.0.0.1:5173/", "http://127.0.0.1:5173/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6
password_requirements = ""

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.email.template.confirmation]
subject = "Confirm your account / 验证账户 · US Equity Monitor"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password / 重置密码 · US Equity Monitor"
content_path = "./supabase/templates/recovery.html"

[functions.market-data]
# The handler independently verifies the end-user access token with Auth getUser.
# Needed for current publishable-key compatibility, never a public data endpoint.
verify_jwt = false
