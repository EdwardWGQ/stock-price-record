name: Build macOS Desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Create native application icon
        run: |
          mkdir -p assets/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/icon.png --out "assets/icon.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/icon.png --out "assets/icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns assets/icon.iconset -o assets/icon.icns
      - name: Build DMG and ZIP
        run: npm run dist:mac -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged app and disk image
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node verify-mac.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: US-Equity-Monitor-mac-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/mac-verification-*.json
          if-no-files-found: error
          retention-days: 30
  release:
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: US-Equity-Monitor-mac-*
          path: mac-release
          merge-multiple: true
      - name: Prepare verified download files
        run: |
          cp desktop/README-macOS.txt mac-release/README-macOS.txt
          cd mac-release
          sha256sum *.dmg *.zip > SHA256SUMS-macOS.txt
      - name: Upload draft Mac release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=desktop-mac-v1.0.0
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "US Equity Monitor 1.0.0 · macOS" --notes-file desktop/RELEASE-macOS.md
          fi
          gh release upload "$tag" mac-release/*.dmg mac-release/*.zip mac-release/SHA256SUMS-macOS.txt mac-release/README-macOS.txt mac-release/mac-verification-*.json --clobber
